name: Щоранковий пошук трейдерів

on:
  schedule:
    # Час — за UTC (Київ = UTC+2 узимку, UTC+3 улітку). Рядок «timezone» GitHub не прийняв —
    # з ним розклад не спрацьовував зовсім, тому його прибрано.
    # Узимку: 8:03, 8:37, 9:11, 9:41, 10:21 за Києвом; улітку перший запуск 8:03 — це 5:03 UTC.
    # Зайвий запуск сам себе пропускає (крок «Чи вже 8:00…» нижче: раніше 8:00 за Києвом
    # або якщо сьогодні вже був запуск — нічого не робить).
    - cron: "3 5 * * *"
    - cron: "3 6 * * *"
    - cron: "37 6 * * *"
    - cron: "11 7 * * *"
    - cron: "41 7 * * *"
    - cron: "21 8 * * *"
  # Ручний запуск (кнопка «Run workflow») і «будильник» cron-job.org о 8:00 за Києвом.
  # Будильник надсилає force=false: тоді запуск пропускається, якщо сьогодні вже був.
  workflow_dispatch:
    inputs:
      force:
        description: "Запустити, навіть якщо сьогодні вже був запуск"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Чи вже 8:00 у Києві і чи сьогодні ще не запускались?
        id: gate
        run: |
          H=$(TZ=Europe/Kyiv date +%H); TODAY=$(TZ=Europe/Kyiv date +%F)
          LAST=$(python3 -c "import json;print(json.load(open('docs/data.json')).get('run',{}).get('run_date',''))" 2>/dev/null || echo "")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" != "false" ]; then GO=1
          elif [ "$H" -ge 8 ] && [ "$LAST" != "$TODAY" ]; then GO=1
          else GO=0; fi
          echo "Київ: $H год, останній запуск: $LAST, запускаємо: $GO"
          echo "go=$GO" >> $GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == '1'
        with:
          python-version: "3.12"

      - name: Запуск агента
        if: steps.gate.outputs.go == '1'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PHONES_PASSWORD: ${{ secrets.PHONES_PASSWORD }}
          PAGE_URL: https://ssolodovnyk.github.io/uagro-traders/
        run: |
          pip install -r agent/requirements.txt
          python -m playwright install --with-deps chromium
          python agent/run.py

      - name: Зберегти результат
        if: steps.gate.outputs.go == '1'
        run: |
          git config user.name "uagro-agent"
          git config user.email "uagro-agent@users.noreply.github.com"
          git add docs/data.json state/seen.json
          git commit -m "Оновлення $(TZ=Europe/Kyiv date +%F)" || echo "Без змін"
          git pull --rebase origin main
          git push
